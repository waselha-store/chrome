<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>لوحة التحكم</title>
</head>
<body>
    <div class="container" id="loginBox">
        <h2 style="color:var(--gold)">تسجيل الدخول</h2>
        <input type="email" id="email" placeholder="البريد">
        <input type="password" id="pass" placeholder="كلمة المرور">
        <button onclick="login()" class="btn-buy">دخول</button>
    </div>

    <div class="container" id="panel" style="display:none;">
        <h2 style="color:var(--gold)">إدارة المنتجات</h2>
        <input type="text" id="pName" placeholder="اسم المنتج">
        <input type="text" id="pPrice" placeholder="السعر">
        <textarea id="pDesc" placeholder="الوصف"></textarea>
        <input type="file" id="pImg" accept="image/*">
        <button onclick="saveProduct()" class="btn-buy" id="saveBtn">حفظ المنتج</button>
        
        <div class="admin-table-container">
            <table>
                <thead><tr><th>م</th><th>المنتج</th><th>السعر</th><th>تحكم</th></tr></thead>
                <tbody id="productTableBody"></tbody>
            </table>
        </div>
        <br><a href="index.html" style="color:#aaa;">⬅ العودة للمتجر</a>
    </div>
    <script src="app.js"></script>
</body>
</html>

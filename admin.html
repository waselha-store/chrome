<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>لوحة التحكم</title>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2>تسجيل الدخول</h2>
            <input type="text" id="user" class="input-field" placeholder="اسم المستخدم">
            <input type="password" id="pass" class="input-field" placeholder="كلمة المرور">
            <button class="btn-action" onclick="login()">دخول</button>
            <p style="margin-top:20px;"><a href="index.html" style="color:var(--text-dim);">العودة للرئيسية</a></p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>

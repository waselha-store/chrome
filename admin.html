<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | وصلها ستور</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" style="text-decoration: none;">
            <span class="logo-main">وصلـها ستور</span>
            <span class="logo-sub">WASELHA STORE</span>
        </a>
        <div>
            <button class="three-dots-btn" onclick="toggleMenu()">⋮</button>
            <div class="dropdown-menu" id="dropdownMenu">
                <a href="index.html">الرئيسية</a>
                <a href="admin.html">تسجيل الدخول</a>
                <a href="https://wa.me/9647850281586" target="_blank">تواصل معنا</a>
            </div>
        </div>
    </header>

    <!-- Centered Form Container -->
    <div class="login-page-container">
        
        <!-- Login Card -->
        <div class="auth-card" id="loginCard">
            <h2>تسجيل الدخول</h2>
            <p class="subtitle">مرحباً بك في منصة وصلها لتقنيات NFC</p>

            <form onsubmit="handleLogin(event)" class="auth-form">
                <div class="input-wrapper">
                    <label class="input-label">اسم المستخدم</label>
                    <input type="text" id="username" class="form-input-lg" placeholder="أدخل اسم المستخدم" required autocomplete="off">
                </div>

                <div class="input-wrapper">
                    <label class="input-label">كلمة المرور</label>
                    <input type="password" id="password" class="form-input-lg" placeholder="أدخل كلمة المرور" required>
                </div>

                <button type="submit" class="btn-submit">دخول المنصة</button>
            </form>

            <div class="divider">
                <span>أو</span>
            </div>

            <button type="button" class="btn-google" onclick="handleGoogleLogin()">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12.5s.7 2.8 1.9 5.2l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/></svg>
                متابعة باستخدام Google
            </button>

            <a href="index.html" class="back-link">← العودة للصفحة الرئيسية</a>
        </div>

        <!-- Dashboard Card (Shown only after admin123 login) -->
        <div class="auth-card" id="dashboardCard" style="display: none; max-width: 650px;">
            <h2 style="color: var(--accent-cyan);">لوحة تحكم الأدمن</h2>
            <p class="subtitle">إدارة المنتجات والخدمات</p>

            <div class="auth-form" style="margin-bottom: 25px;">
                <input type="text" id="pName" class="form-input-lg" placeholder="اسم المنتج">
                <input type="text" id="pPrice" class="form-input-lg" placeholder="السعر (مثال: 15,000 IQD)">
                <input type="text" id="pDesc" class="form-input-lg" placeholder="وصف المنتج">
                <button onclick="addNewProduct()" class="btn-submit">إضافة المنتج للمتجر</button>
            </div>

            <button onclick="handleLogout()" class="btn-submit" style="background: #334155; color: #fff;">تسجيل الخروج</button>
        </div>

    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", checkAuthStatus);
    </script>
</body>
</html>

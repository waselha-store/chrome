<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | وصلها ستور</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" style="text-decoration: none;">
            <span class="logo-main">وصلـها ستور</span>
            <span class="logo-sub">WASELHA STORE</span>
        </a>
        <div style="position: relative;">
            <button class="three-dots-btn" onclick="toggleMenu()">⋮</button>
            <div class="dropdown-menu" id="dropdownMenu">
                <a href="index.html">الرئيسية</a>
                <a href="admin.html">تسجيل الدخول</a>
                <a href="https://wa.me/9647850281586" target="_blank">تواصل معنا</a>
            </div>
        </div>
    </header>

    <div class="container">

        <!-- Login Form -->
        <div class="admin-card" id="loginCard" style="max-width: 450px; margin: 40px auto;">
            <h2 style="text-align: center; color: var(--accent-cyan); margin-bottom: 20px;">تسجيل الدخول للأدمن</h2>
            <form onsubmit="handleLogin(event)" class="form-group">
                <input type="text" id="username" class="form-input" placeholder="اسم المستخدم" required autocomplete="off">
                <input type="password" id="password" class="form-input" placeholder="كلمة المرور" required>
                <button type="submit" class="btn-primary">دخول</button>
            </form>
        </div>

        <!-- Dashboard & Product Management -->
        <div id="dashboardCard" style="display: none;">
            
            <!-- Form Card -->
            <div class="admin-card">
                <h2 style="color: var(--accent-cyan);">إضافة منتج جديد</h2>
                <div class="form-group">
                    <input type="text" id="pName" class="form-input" placeholder="اسم المنتج (مثال: ستاند NFC أكريليك)">
                    <input type="text" id="pPrice" class="form-input" placeholder="السعر (مثال: 15,000 IQD)">
                    <input type="text" id="pDesc" class="form-input" placeholder="وصف المنتج المختصر">
                    
                    <span class="file-label">اختر صورة المنتج من جهازك:</span>
                    <input type="file" id="pImgFile" class="form-input" accept="image/*">
                    
                    <button onclick="addNewProduct()" class="btn-primary">إضافة المنتج إلى المتجر</button>
                </div>
            </div>

            <!-- Admin Table Card -->
            <div class="admin-card">
                <h2 style="color: var(--accent-cyan); margin-bottom: 15px;">إدارة المنتجات المضافة</h2>
                <div class="table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>الصورة</th>
                                <th>اسم المنتج</th>
                                <th>الوصف</th>
                                <th>السعر</th>
                                <th>إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="adminTableBody">
                            <!-- Rows generated dynamically -->
                        </tbody>
                    </table>
                </div>
                <button onclick="handleLogout()" class="btn-primary" style="background: #334155; margin-top: 25px; width: auto; padding: 10px 25px;">تسجيل الخروج</button>
            </div>

        </div>

    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", checkAuthStatus);
    </script>
</body>
</html>

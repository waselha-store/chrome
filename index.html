<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وصلها ستور | WASELHA STORE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #ffffff; line-height: 1.6; padding-bottom: 60px; }
        header { background: #161b22; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0, 242, 254, 0.2); position: sticky; top: 0; z-index: 1000; }
        .logo h1 { font-size: 1.3rem; color: #ffffff; text-align: right; }
        .logo span { display: block; font-size: 0.65rem; color: #00f2fe; letter-spacing: 2px; text-align: right; }
        .menu-container { position: relative; }
        .menu-btn { background: none; border: none; color: #00f2fe; font-size: 1.8rem; cursor: pointer; padding: 0 5px; line-height: 1; }
        .dropdown-menu { display: none; position: absolute; left: 0; top: 45px; background: #161b22; border: 1px solid #00f2fe; border-radius: 10px; padding: 8px; z-index: 1001; min-width: 190px; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8); }
        .dropdown-menu.show { display: block; }
        .dropdown-item { color: #ffffff; display: block; padding: 10px 12px; text-decoration: none; border-radius: 6px; font-size: 0.9rem; text-align: right; transition: all 0.2s ease; cursor: pointer; background: none; border: none; width: 100%; }
        .dropdown-item:hover { background: rgba(0, 242, 254, 0.1); color: #00f2fe; }
        .submenu { display: none; padding-right: 15px; margin: 5px 0; border-right: 2px solid rgba(0, 242, 254, 0.3); }
        .submenu.show { display: block; }
        .hero { text-align: center; padding: 40px 20px; background: linear-gradient(180deg, #161b22 0%, #0d1117 100%); }
        .hero h2 { font-size: 1.5rem; color: #00f2fe; margin-bottom: 10px; }
        .hero p { color: #8b949e; max-width: 600px; margin: 0 auto; font-size: 0.9rem; }
        .products-section { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .products-section h3 { text-align: center; font-size: 1.3rem; margin-bottom: 25px; color: #ffffff; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .product-img { width: 100%; height: 180px; object-fit: cover; background: #0d1117; }
        .product-info { padding: 15px; text-align: right; }
        .product-title { font-size: 1.1rem; color: #00f2fe; margin-bottom: 5px; }
        .product-desc { font-size: 0.85rem; color: #8b949e; margin-bottom: 10px; }
        .product-price { font-size: 1rem; color: #fff; font-weight: bold; margin-bottom: 15px; }
        .order-btn { display: block; width: 100%; padding: 10px; background: #00f2fe; color: #0d1117; border: none; border-radius: 6px; font-weight: bold; text-align: center; text-decoration: none; cursor: pointer; transition: opacity 0.2s; }
        .order-btn:hover { opacity: 0.9; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #161b22; border: 1px solid #00f2fe; border-radius: 12px; width: 100%; max-width: 380px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); position: relative; }
        .modal-box h3 { color: #00f2fe; text-align: center; margin-bottom: 20px; font-size: 1.3rem; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; color: #8b949e; margin-bottom: 5px; text-align: right; }
        .form-group input { width: 100%; padding: 10px 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; font-size: 0.95rem; text-align: right; }
        .form-group input:focus { border-color: #00f2fe; outline: none; }
        .login-btn { width: 100%; padding: 11px; background: #00f2fe; color: #0d1117; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        .close-modal { position: absolute; top: 12px; left: 15px; background: none; border: none; color: #8b949e; font-size: 1.2rem; cursor: pointer; }
        .floating-chat { position: fixed; bottom: 20px; left: 20px; background: #25d366; color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4); text-decoration: none; font-size: 1.5rem; z-index: 999; }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>وصلها ستور</h1>
            <span>WASELHA STORE</span>
        </div>
        <div class="menu-container">
            <button class="menu-btn" onclick="toggleMenu()">⋮</button>
            <div class="dropdown-menu" id="dropdownMenu">
                <a href="index.html" class="dropdown-item">الرئيسية 🏠</a>
                <button class="dropdown-item" onclick="toggleSubmenu()">تواصل معنا 📞</button>
                <div class="submenu" id="submenu">
                    <a href="https://wa.me/9647850281586" target="_blank" class="dropdown-item">واتساب 💬</a>
                    <a href="https://www.instagram.com/nfc_waselha?igsi=MTJuamJqY3lxNGx4MA==" target="_blank" class="dropdown-item">انستغرام 📸</a>
                </div>
                <button class="dropdown-item" onclick="openLoginModal()">تسجيل الدخول 🔐</button>
            </div>
        </div>
    </header>

    <section class="hero">
        <h2>مستقبل التفاعل الرقمي بين يديك</h2>
        <p>أحدث حلول NFC وتقنيات التقييم الذكي للمطاعم والكافيهات والمؤسسات</p>
    </section>

    <section class="products-section">
        <h3>منتجاتنا المميزة</h3>
        <div id="products-container" class="products-grid">
            <!-- المنتجات ستتحمل من قاعدة البيانات -->
        </div>
    </section>

    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <button class="close-modal" onclick="closeLoginModal()">✕</button>
            <h3>تسجيل الدخول</h3>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                </div>
                <button type="submit" class="login-btn">دخول</button>
            </form>
        </div>
    </div>

    <a href="https://wa.me/9647850281586" class="floating-chat" target="_blank">💬</a>

    <script>
        const DB_URL = "https://waselha-store-default-rtdb.firebaseio.com/products.json";

        function toggleMenu() { document.getElementById('dropdownMenu').classList.toggle('show'); }
        function toggleSubmenu() { document.getElementById('submenu').classList.toggle('show'); }
        function openLoginModal() { document.getElementById('loginModal').classList.add('active'); document.getElementById('dropdownMenu').classList.remove('show'); }
        function closeLoginModal() { document.getElementById('loginModal').classList.remove('active'); }
        
        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (user === 'admin' && pass === '123') {
                window.location.href = 'admin.html';
            } else {
                alert('مرحباً بك يا ' + user);
                closeLoginModal();
            }
        }

        async function loadStoreProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = `<p style="text-align:center; color:#8b949e; grid-column: 1/-1;">جاري جلب المنتجات من القاعدة السحابية...</p>`;
            
            try {
                const response = await fetch(DB_URL);
                const data = await response.json();
                
                container.innerHTML = '';
                if (!data || Object.keys(data).length === 0) {
                    container.innerHTML = `<p style="text-align:center; color:#8b949e; grid-column: 1/-1;">لا توجد منتجات مضافة حالياً.</p>`;
                    return;
                }

                Object.keys(data).forEach(key => {
                    const p = data[key];
                    container.innerHTML += `
                        <div class="product-card">
                            <img src="${p.image}" class="product-img" alt="${p.name}">
                            <div class="product-info">
                                <h4 class="product-title">${p.name}</h4>
                                <p class="product-desc">${p.desc}</p>
                                <div class="product-price">${p.price} د.ع</div>
                                <a href="https://wa.me/9647850281586?text=أريد طلب المنتج: ${encodeURIComponent(p.name)}" target="_blank" class="order-btn">اطلب الآن</a>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                container.innerHTML = `<p style="text-align:center; color:#da3633; grid-column: 1/-1;">تعذر الاتصال بقاعدة البيانات.</p>`;
            }
        }

        window.onload = loadStoreProducts;

        window.onclick = function(event) {
            if (!event.target.matches('.menu-btn') && !event.target.closest('.dropdown-menu')) {
                document.getElementById('dropdownMenu').classList.remove('show');
            }
            if (event.target === document.getElementById('loginModal')) {
                closeLoginModal();
            }
        }
    </script>
</body>
</html>

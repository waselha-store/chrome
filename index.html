<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وصلها ستور | WASELHA STORE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            line-height: 1.6;
            padding-bottom: 50px;
        }
        header {
            background: #161b22;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 242, 254, 0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo h1 {
            font-size: 1.4rem;
            color: #ffffff;
        }
        .logo span {
            display: block;
            font-size: 0.7rem;
            color: #00f2fe;
            letter-spacing: 2px;
        }
        /* تصميم قائمة النقاط الثلاث باستخدام HTML البحت */
        details {
            position: relative;
        }
        details summary {
            list-style: none;
            background: none;
            border: none;
            color: #00f2fe;
            font-size: 1.8rem;
            cursor: pointer;
            padding: 5px 10px;
            line-height: 1;
        }
        details summary::-webkit-details-marker {
            display: none;
        }
        .dropdown-menu {
            position: absolute;
            left: 0;
            top: 45px;
            background: #161b22;
            border: 1px solid #00f2fe;
            border-radius: 8px;
            padding: 10px;
            z-index: 1001;
            min-width: 160px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .dropdown-menu a {
            color: #ffffff;
            display: block;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .dropdown-menu a:hover {
            background: rgba(0, 242, 254, 0.1);
            color: #00f2fe;
        }
        .hero {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(180deg, #161b22 0%, #0d1117 100%);
        }
        .hero h2 {
            font-size: 1.8rem;
            color: #00f2fe;
            margin-bottom: 15px;
        }
        .hero p {
            color: #8b949e;
            max-width: 600px;
            margin: 0 auto;
            font-size: 0.95rem;
        }
        .products-section {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .products-section h3 {
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 25px;
            color: #ffffff;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        .floating-chat {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #25d366;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-decoration: none;
            font-size: 1.5rem;
            z-index: 999;
        }
    </style>
</head>
<body>

    <header>
        <div class="menu-container">
            <details>
                <summary>⋮</summary>
                <div class="dropdown-menu">
                    <a href="index.html">الرئيسية 🏠</a>
                    <a href="admin.html">لوحة التحكم ⚙️</a>
                </div>
            </details>
        </div>
        <div class="logo" style="text-align: left;">
            <h1>وصلها ستور</h1>
            <span>WASELHA STORE</span>
        </div>
    </header>

    <section class="hero">
        <h2>مستقبل التفاعل الرقمي بين يديك</h2>
        <p>أحدث حلول NFC وتقنيات التقييم الذكي للمطاعم والكافيهات والمؤسسات</p>
    </section>

    <section class="products-section">
        <h3>منتجاتنا المميزة</h3>
        <div id="products-container" class="products-grid">
            <p style="text-align:center; color:#888; grid-column: 1/-1;">جاري تحميل المنتجات...</p>
        </div>
    </section>

    <a href="https://wa.me/" class="floating-chat" target="_blank" title="تواصل معنا">💬</a>

    <script src="app.js"></script>
</body>
</html>
